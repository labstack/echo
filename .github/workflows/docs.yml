name: Documentation compatibility

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    name: Compile source-owned examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: docs/examples/go.sum
      - name: Compile examples against this Echo revision
        run: go test ./...
        working-directory: docs/examples
      - name: Extract source-backed config fields
        run: go run ./cmd/config-fields -revision "$GITHUB_SHA" > config-fields.json
        working-directory: docs/examples
      - name: Keep the generated reference for the website integration
        uses: actions/upload-artifact@v4
        with:
          name: echo-config-fields
          path: docs/examples/config-fields.json

  website:
    name: Build echox against this Echo revision
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Echo
        uses: actions/checkout@v6
        with:
          path: echo
      - name: Checkout website
        uses: actions/checkout@v6
        with:
          repository: labstack/echox
          path: echox
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: echox/go.sum
      - name: Use proposed Echo source for cookbook tests
        run: go work init ../echo .
        working-directory: echox
      - name: Compile cookbook examples
        run: go test ./...
        working-directory: echox
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: echox/site/package-lock.json
      - name: Install site dependencies
        run: npm ci --ignore-scripts
        working-directory: echox/site
      - name: Build site
        run: npm run build
        working-directory: echox/site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
